<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="info">
        <div class="info">
        <p> enter age: </p>
        <label for="age">User age: </label>
        <input type="number" id="age">
        </div>

        <div class="button-check">
            <button type="button" id="button" onclick= "checkAge()">check</button>
        </div>

        <div id="result"></div>

        <div class="button-rest">
            <button type="button" id="reset" onclick="reset()">reset</button>
        </div>

    </div>

    <script>
        function checkAge(){
            let enteredAge = document.getElementById("age").value;

            if(enteredAge>=0 && enteredAge <=12){
                document.getElementById("result").innerHTML = "Child";
            }else if(enteredAge>=13 && enteredAge<= 19){
                document.getElementById("result").innerHTML = "Teenager";
            }else if(enteredAge>=20 && enteredAge<= 59){
                document.getElementById("result").innerHTML = "Adult";
            }else{
                document.getElementById("result").innerHTML = "Senior Citizen";
            }
        }

        function reset(){
            document.getElementById("age").value = "";
            document.getElementById("result").innerHTML = "";
        }
    </script>
</body>
</html>
