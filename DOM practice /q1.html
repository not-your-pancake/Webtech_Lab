<!DOCTYPE html>
<html lang="en">
<head>
    <title>Shopping Cart</title>
</head>
<body>
    <h2>Products</h2>
    <div id="product-list">


        
    </div>

    <h2>Shopping Cart</h2>
    <div id="cart-section"></div>

    <script>
        // chart boshailam 
        const products = [
            { id: 1, name: "kacchi", price: 150 },
            { id: 2, name: "khichuri", price: 100 },
            { id: 3, name: "borhani", price: 50 }
        ];

        let cart = [];

        // Product List dilam
        function renderProducts() {
            const productList = document.getElementById("product-list");
            
            // Map products into HTML strings and join them
            productList.innerHTML = products.map(product => `
                <div>
                    <span>${product.name} - ${product.price} BDT</span>
                    <button onclick="addToCart(${product.id})">Add to Cart</button>
                </div>
            `).join(''); // eita '' (space gula) thaklei append 
        }

        // 4. Render Cart Section
        function renderCart() {
            const cartSection = document.getElementById("cart-section");

            // Empty Cart State
            if (cart.length === 0) {
                cartSection.innerHTML = "<p>Cart is empty</p>";
                return;
            }

            // Calculate Totals
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            const totalPrice = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

            // Generate Cart Items HTML
            const cartItemsHTML = cart.map(item => `
                <div style="margin: 8px 0;">
                    <span>${item.name} - ${item.price} BDT x ${item.quantity}</span>
                    <button onclick="updateQuantity(${item.id}, 1)">+</button>
                    <button onclick="updateQuantity(${item.id}, -1)">-</button>
                    <button onclick="removeFromCart(${item.id})">Remove</button>
                </div>
            `).join('');

            // Set Cart HTML
            cartSection.innerHTML = `
                <p><strong>Total Items:</strong> ${totalItems} | <strong>Total Price:</strong> ${totalPrice} BDT</p>
                ${cartItemsHTML}
            `;
        }

        // --- Cart Functions ---

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);

            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            renderCart();
        }

        function updateQuantity(productId, amount) {
            const item = cart.find(i => i.id === productId);
            if (item) {
                item.quantity += amount;
                if (item.quantity <= 0) {
                    removeFromCart(productId);
                    return;
                }
            }
            renderCart();
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            renderCart();
        }

        // Initial Load
        renderProducts();
        renderCart();
    </script>
</body>
</html>
